name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # публикация релиза по тегу

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # Самоподписанный сертификат из секретов → временная связка ключей.
      # Одна и та же подпись у всех сборок — macOS не сбрасывает разрешения при обновлении.
      # Без секретов (PR из форка) собираем с ad-hoc подписью.
      - name: Import signing certificate
        id: signing
        env:
          P12: ${{ secrets.MACOS_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "No signing secrets — ad-hoc signature"
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW=$(openssl rand -base64 24)
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Сертификат самоподписанный — явно доверяем ему для подписи кода
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain macos/signing/BochaSwitcher-signing.pem
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "identity=Bocha Switcher Signing" >> "$GITHUB_OUTPUT"

      # Universal (arm64 + x86_64) .app
      - name: Build app
        env:
          RS_SIGN_ID: ${{ steps.signing.outputs.identity }}
        run: bash macos/build_app.sh

      - name: Verify
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          APP=macos/BochaSwitcher.app
          lipo -archs "$APP"/Contents/MacOS/*
          codesign --verify --deep --strict --verbose=2 "$APP"
          REQ=$(codesign -d -r - "$APP" 2>&1 | grep designated)
          echo "$REQ"
          if [ "$IDENTITY" != "-" ] && [[ "$REQ" != *"certificate root"* ]]; then
            echo "ERROR: app is not signed with the Bocha Switcher certificate"; exit 1
          fi

      - name: Create DMG
        id: dmg
        run: |
          DMG=$(bash macos/make_dmg.sh "$PWD" | tail -1)
          echo "path=$DMG" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DMG" .dmg)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 30

      - uses: actions/upload-artifact@v7
        with:
          name: icon-preview
          path: macos/.build/BochaSwitcher.iconset/icon_512x512@2x.png
          retention-days: 7

      # Тег vX.Y.Z → GitHub Release: DMG + version.json (фид автообновления).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          IDENTITY: ${{ steps.signing.outputs.identity }}
          DMG: ${{ steps.dmg.outputs.path }}
        run: |
          VERSION=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "ERROR: tag $GITHUB_REF_NAME does not match version.json ($VERSION)"; exit 1
          fi
          if [ "$IDENTITY" = "-" ]; then
            echo "ERROR: releases must be signed with the Bocha Switcher certificate"; exit 1
          fi
          FEED_DIR="$RUNNER_TEMP/feed"
          mkdir -p "$FEED_DIR"
          python3 - "$DMG" "$FEED_DIR/version.json" <<'PY'
          import hashlib, json, os, sys
          dmg, out = sys.argv[1], sys.argv[2]
          src = json.load(open("version.json"))
          feed = {
              "version": src["version"],
              "build": src.get("build", "1"),
              "url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{os.environ['GITHUB_REF_NAME']}",
              "notes": src.get("notes", ""),
              "sha256": hashlib.sha256(open(dmg, "rb").read()).hexdigest(),
          }
          json.dump(feed, open(out, "w"), indent=2, ensure_ascii=False)
          print(json.dumps(feed, indent=2, ensure_ascii=False))
          PY
          NOTES=$(python3 -c "import json;print(json.load(open('version.json')).get('notes') or 'Bocha Switcher $VERSION')")
          gh release create "$GITHUB_REF_NAME" "$DMG" "$FEED_DIR/version.json" \
            --title "Bocha Switcher $VERSION" --notes "$NOTES"
